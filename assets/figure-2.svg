<svg xmlns="http://www.w3.org/2000/svg" width="662" height="595" viewBox="0 0 662 595" role="img" aria-labelledby="title desc">
  <title id="title">Effective gravitational charge of the quantum vacuum</title>
  <desc id="desc">A smooth schematic blue curve rises from negative gravitational charge and asymptotically approaches the red zero-pressure line from below. A dashed vertical line through the inflection point separates Phase 2 on the left from Phase 3 on the right. Phase 2 starts a short distance after the beginning of the curve horizontally, and it extends vertically from the red zero-pressure line to the bottom, with dashed lines at both horizontal boundaries. The curve is a qualitative illustration without numerical axis scales.</desc>
